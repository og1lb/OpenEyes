limit_req_zone $binary_remote_addr zone=is_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=is_auth:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=is_conn:10m;

upstream openeyes {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN www.DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://DOMAIN$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;

    return 301 https://DOMAIN$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:is_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 11m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    limit_conn is_conn 40;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ~ /\.(?!well-known) {
        return 404;
    }

    location /api/auth/ {
        limit_req zone=is_auth burst=10 nodelay;
        proxy_pass http://openeyes;
        include /etc/nginx/snippets/openeyes-proxy.conf;
    }

    location /api/ {
        limit_req zone=is_api burst=40 nodelay;
        proxy_pass http://openeyes;
        include /etc/nginx/snippets/openeyes-proxy.conf;
    }

    location / {
        proxy_pass http://openeyes;
        include /etc/nginx/snippets/openeyes-proxy.conf;
    }
}
